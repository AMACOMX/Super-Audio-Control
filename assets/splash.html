<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Super Audio Control</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 38%, #0d2c4e 0%, #071321 48%, #04070d 100%);
      color: #e8f5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      user-select: none;
    }
    .frame {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 26px 28px 24px;
      border: 1px solid rgba(42, 160, 255, .42);
      box-shadow: inset 0 0 48px rgba(0, 135, 255, .11), 0 0 50px rgba(0, 125, 255, .12);
    }
    .logo {
      display: block; width: 410px; height: 410px; max-width: 100%; max-height: 410px;
      object-fit: contain; filter: drop-shadow(0 0 22px rgba(0, 153, 255, .22));
    }
    .status { display:flex; align-items:center; gap:9px; margin-top:10px; font-size:11px; font-weight:700; letter-spacing:.22em; color:#9fb8d2; }
    .led { width:7px; height:7px; border-radius:50%; background:#00c7ff; box-shadow:0 0 12px #00c7ff; animation:pulse 1.1s ease-in-out infinite; }
    .bar { width:190px; height:3px; overflow:hidden; border-radius:8px; margin-top:15px; background:#12263b; }
    .bar::after { content:""; display:block; height:100%; width:40%; border-radius:8px; background:linear-gradient(90deg,#00a4ff,#35f0ff); box-shadow:0 0 12px #00a4ff; animation:load 1.35s ease-in-out infinite; }
    .version { position:absolute; bottom:12px; right:16px; color:#49627a; font-size:9px; letter-spacing:.12em; }
    @keyframes pulse { 50% { opacity:.45; transform:scale(.8); } }
    @keyframes load { from { transform:translateX(-110%); } to { transform:translateX(360%); } }
  </style>
</head>
<body>
  <main class="frame">
    <img class="logo" src="branding/super-audio-control-logo.png" alt="Super Audio Control" />
    <div class="status"><span class="led"></span><span>INITIALIZING AUDIO ENGINE</span></div>
    <div class="bar" aria-hidden="true"></div>
    <div class="version">WASAPI · CORE AUDIO ROUTER</div>
  </main>
</body>
</html>
